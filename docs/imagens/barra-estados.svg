  <g font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="14">
    <text x="20" y="65" xml:space="preserve"><tspan fill="#8B949E"># ctx de 70% a 84%: contexto enchendo (amarelo)</tspan></text>
    <text x="20" y="86" xml:space="preserve"><tspan fill="#E6EDF3">Opus 5.5·high │ </tspan><tspan fill="#D29922">ctx ▰▰▰▰▰▰▱▱ 76%</tspan><tspan fill="#E6EDF3"> │ </tspan><tspan fill="#3FB950">cache ▰▰▰▰▰▰▰▱ 92%</tspan></text>
