    <text x="20" y="212" xml:space="preserve"><tspan fill="#E6EDF3">Opus 5.5·high │ </tspan><tspan fill="#3FB950">ctx ▰▰▰▱▱▱▱▱ 37%</tspan><tspan fill="#E6EDF3"> │ </tspan><tspan fill="#D29922">cache ▰▰▰▰▰▱▱▱ 64%</tspan></text>
    <text x="20" y="233" xml:space="preserve"></text>
    <text x="20" y="254" xml:space="preserve"><tspan fill="#8B949E"># acerto de cache abaixo de 50%: começo de sessão ou troca de modelo (vermelho)</tspan></text>
    <text x="20" y="275" xml:space="preserve"><tspan fill="#E6EDF3">Opus 5.5·high │ </tspan><tspan fill="#3FB950">ctx ▰▱▱▱▱▱▱▱ 4%</tspan><tspan fill="#E6EDF3"> │ </tspan><tspan fill="#F85149">cache ▰▰▱▱▱▱▱▱ 31%</tspan></text>
