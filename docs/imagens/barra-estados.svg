    <text x="20" y="149" xml:space="preserve"><tspan fill="#E6EDF3">Opus 5.5·high │ </tspan><tspan fill="#F85149">ctx ▰▰▰▰▰▰▰▱ 88%</tspan><tspan fill="#E6EDF3"> │ </tspan><tspan fill="#3FB950">cache ▰▰▰▰▰▰▰▱ 92%</tspan></text>
    <text x="20" y="170" xml:space="preserve"></text>
