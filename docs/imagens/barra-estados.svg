<svg xmlns="http://www.w3.org/2000/svg" width="704" height="423" viewBox="0 0 704 423" role="img" aria-label="Seis estados da barra: ctx 76% em amarelo; ctx 88% em vermelho; cache 64% em amarelo; cache 31% em vermelho, com ctx 4%, no começo de uma sessão; um effort desconhecido, com só o nome do modelo; e uma sessão sem dado ainda, com travessões e sem barrinha.">
